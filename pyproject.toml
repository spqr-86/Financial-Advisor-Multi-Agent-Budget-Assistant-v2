[tool.poetry]
name = "budget-assistant"
version = "2.0.0"
description = "Multi-Agent Budget Assistant with Telegram Bot"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# Telegram Bot
aiogram = "^3.4.0"
aiohttp = "^3.9.0"
# API Server
fastapi = "^0.115.0"
uvicorn = {version = "^0.34.0", extras = ["standard"]}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
# AI Agents
google-generativeai = "^0.8.0"
# Google Sheets
gspread = "^5.12.0"
google-auth = "^2.25.0"
# Utilities
python-dotenv = "^1.0.0"
python-dateutil = "^2.8.2"
google-adk = "^1.20.0"
# MCP Server
fastmcp = "^2.0.0"
# Data Analysis
pandas = "^2.0.0"
numpy = "^1.24.0"
jinja2 = "^3.1.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
ruff = "^0.1.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
